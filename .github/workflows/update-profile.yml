name: Update NERV Git-Cat

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_cat.py'
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image library
        run: pip install pillow
      - name: Generate animated activity cat
        env:
          GITHUB_USERNAME: Joacoxz712
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_cat.py
      - name: Commit generated animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/git-cat.gif
          git diff --cached --quiet || git commit -m 'chore(profile): update animated Git-Cat'
          git push