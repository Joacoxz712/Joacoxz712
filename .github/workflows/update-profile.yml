name: Refresh Coco's profile data and Git-Cat

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_cat.py'
      - 'scripts/round_gifs.py'
      - 'README.md'
      - 'scripts/generate_profile_stats.py'
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image library
        run: pip install pillow
      - name: Generate GitHub profile graphics
        env:
          GITHUB_USERNAME: Joacoxz712
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_profile_stats.py
          python scripts/generate_cat.py
          python scripts/round_gifs.py
      - name: Commit generated profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/rounded assets/git-cat.gif assets/profile-stats.svg assets/profile-languages.svg assets/contribution-calendar.svg
          git diff --cached --quiet || git commit -m 'chore(profile): refresh live GitHub data'
          git pull --rebase origin main
          git push
