<path class="scan" d="M820 90H1140" stroke="#d16b87" stroke-opacity=".3"/>
<text x="866" y="326" fill="#77788a" font-size="10" letter-spacing="3">A LITTLE CHAOS, A LOT OF CURIOSITY</text>
</svg>