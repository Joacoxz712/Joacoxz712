<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090f"/><stop offset=".55" stop-color="#11121d"/><stop offset="1" stop-color="#1b101b"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#7f2444" stop-opacity=".5"/><stop offset="1" stop-color="#7f2444" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#9aa8b8" stroke-opacity=".09"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
 <style>
  text{font-family:Comfortaa,'Josefin Sans',sans-serif}
  .float{animation:float 5s ease-in-out infinite;transform-origin:980px 166px}
  .blink{animation:blink 2.8s steps(2) infinite}
  .scan{animation:scan 5s linear infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes blink{0%,90%,100%{opacity:1}92%,96%{opacity:.15}}
  @keyframes scan{0%{transform:translateY(-110px);opacity:0}20%{opacity:.4}80%{opacity:.2}100%{transform:translateY(110px);opacity:0}}
 </style>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#grid)"/>
<ellipse cx="980" cy="170" rx="270" ry="230" fill="url(#glow)" filter="url(#blur)"/>
<path d="M0 14H1200" stroke="#9d3151" stroke-width="3"/>
<path d="M46 52V307" stroke="#9d3151" stroke-width="2"/>
<path d="M70 76H520M70 84H300" stroke="#6d7488" stroke-opacity=".38"/>
<text x="76" y="66" fill="#bd6c83" font-size="12" letter-spacing="4">JOACO / PERSONAL ARCHIVE</text>
<text x="68" y="174" fill="#f0edf2" font-size="78" font-weight="700" letter-spacing="-3">Coco<span fill="#a83e5d">.</span></text>
<text x="74" y="218" fill="#b9b7c5" font-size="20" letter-spacing=".6">I make things, break things, then make them better.</text>
<text x="75" y="273" fill="#7d8295" font-size="11" letter-spacing="2.4">CODE  /  WORLDBUILDING  /  EXPERIMENTS</text>
<g class="float">
 <circle cx="980" cy="172" r="128" fill="#151724" stroke="#5d344e" stroke-width="1.5"/>
 <circle cx="980" cy="172" r="111" fill="none" stroke="#a84665" stroke-opacity=".55" stroke-dasharray="2 9"/>
 <circle cx="980" cy="172" r="88" fill="none" stroke="#74849a" stroke-opacity=".28"/>
 <g transform="translate(895 81)">
  <path d="M25 78L34 12L82 46Q112 31 143 46L191 12L200 79Q218 111 201 151Q180 190 112 190Q45 190 23 151Q7 112 25 78Z" fill="#e8e4e8" stroke="#9a8c9b" stroke-width="3"/>
  <path d="M47 111Q59 100 73 111M151 111Q165 100 177 111" fill="none" stroke="#4f405c" stroke-width="6" stroke-linecap="round"/>
  <path d="M105 129L112 135L119 129" fill="none" stroke="#a33c5b" stroke-width="3" stroke-linecap="round"/>
  <path d="M96 147Q112 157 128 147" fill="none" stroke="#a33c5b" stroke-width="3" stroke-linecap="round"/>
 </g>
</g>
