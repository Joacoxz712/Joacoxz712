<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="150" viewBox="0 0 1080 150">
<defs><style>
 text{font-family:Comfortaa,'Josefin Sans',sans-serif}
 .tech{transform-box:fill-box;transform-origin:center;animation:levitate 4.6s ease-in-out infinite;transition:transform .25s ease,filter .25s ease}
 .t2{animation-delay:.25s}.t3{animation-delay:.5s}.t4{animation-delay:.75s}.t5{animation-delay:1s}.t6{animation-delay:1.25s}.t7{animation-delay:1.5s}.t8{animation-delay:1.75s}.t9{animation-delay:2s}
 .tech:hover{transform:translateY(-9px) scale(1.12);filter:drop-shadow(0 8px 10px #b34c6c99)}
 .beam{animation:beam 5s ease-in-out infinite}
 @keyframes levitate{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
 @keyframes beam{0%,100%{opacity:.12}50%{opacity:.55}}
</style></defs>
<rect x="1" y="1" width="1078" height="148" rx="17" fill="#0c0d15" stroke="#38303e"/>
<path d="M20 37H1060" stroke="#a74767" stroke-opacity=".7"/>
<text x="25" y="25" fill="#c2768e" font-size="10" letter-spacing="3">THE CURRENT TOOLBOX</text>
<text x="1052" y="25" fill="#6e7183" font-size="9" text-anchor="end" letter-spacing="1.5">09 OBJECTS / 01 WORKBENCH</text>
