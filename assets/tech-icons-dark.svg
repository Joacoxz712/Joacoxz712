<g class="tech t4"><rect x="374" y="51" width="108" height="76" rx="11" fill="#171722" stroke="#514052"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vitejs/vitejs-original.svg" x="406" y="67" width="44" height="44"/></g>
